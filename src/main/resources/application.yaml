server:
  servlet:
    context-path: /e-shop

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    path: /swagger
    operationsSorter: method
    displayRequestDuration: true

spring:
  application:
    name: eshop_api
  datasource:
    url: jdbc:mysql://localhost:3306/db_eshop?createDatabaseIfNotExist=true
    username: sara
    password: Name123*
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

logging:
  level:
    org.springframework.web: "debug"

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
